name: Refresh YouTube stats

# Collects new uploads and refreshes VPH twice a day.
#
# This job does NOT need the app to be deployed anywhere. It builds the app in
# the runner, starts it on localhost, and calls its own cron endpoint — so the
# whole pipeline lives in this repo. (The earlier version curl'd a deployed
# SITE_URL that never existed, which is why every scheduled run failed.)
#
# Setup — Settings → Secrets and variables → Actions → Secrets:
#   NEXT_PUBLIC_SUPABASE_URL
#   NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY
#   SUPABASE_SECRET_KEY
#   YOUTUBE_API_KEY
#   CRON_SECRET          (any long random string; only used inside this job)
#
# The job always exits 0 so a bad run never sends a "Run failed" email. The
# outcome — success or the reason it didn't work — goes to the run's Job
# Summary. Check there, not the step log.
on:
  schedule:
    # GitHub runs cron in UTC. KST is UTC+9.
    - cron: "0 23 * * *" # 08:00 KST (아침)
    - cron: "0 13 * * *" # 22:00 KST (저녁 10시)
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: refresh-cron
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # No 60s serverless ceiling here, so one run can cover the whole catalog
      # instead of the slice an hourly schedule used to be enough for.
      # Measured: 6,446 videos refreshed in 49s, so 600s is ample headroom.
      # Keep CRON_MAX_STATS comfortably above the catalog size (~6.6k today).
      CRON_BUDGET_SECONDS: "600"
      CRON_MAX_STATS: "8000"
      # Leave APP_PASSWORD unset: the login gate stays off for this local boot.

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Check required secrets
        id: precheck
        run: |
          set -u
          missing=""
          for name in NEXT_PUBLIC_SUPABASE_URL NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY SUPABASE_SECRET_KEY YOUTUBE_API_KEY CRON_SECRET; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            {
              echo "### ⚠️ 설정 누락"
              echo ""
              echo "다음 시크릿이 비어 있어 스캔을 건너뛰었습니다:"
              for name in $missing; do echo "- \`$name\`"; done
              echo ""
              echo "Settings → Secrets and variables → Actions → **Secrets** 에서 추가하세요."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      # continue-on-error on the next three steps keeps a broken build or a
      # failed boot from failing the job — which would put the hourly "Run
      # failed" email right back. The scan step reports what went wrong to the
      # Job Summary instead.
      - name: Install dependencies
        if: steps.precheck.outputs.ready == 'true'
        continue-on-error: true
        run: npm ci

      - name: Build
        if: steps.precheck.outputs.ready == 'true'
        continue-on-error: true
        run: npx next build

      - name: Start app
        if: steps.precheck.outputs.ready == 'true'
        continue-on-error: true
        run: |
          set -u
          npx next start -p 3000 > "$RUNNER_TEMP/app.log" 2>&1 &
          echo $! > "$RUNNER_TEMP/app.pid"
          for i in $(seq 1 60); do
            if curl --silent --output /dev/null --max-time 2 http://localhost:3000/login; then
              echo "app is up after ${i}s"
              exit 0
            fi
            sleep 1
          done
          echo "app did not come up in 60s"
          tail -50 "$RUNNER_TEMP/app.log" || true
          exit 1

      - name: Run scan
        if: steps.precheck.outputs.ready == 'true'
        run: |
          set -u
          body="$RUNNER_TEMP/scan.json"
          code=$(curl --silent --show-error \
            --max-time 1500 \
            -o "$body" -w '%{http_code}' \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            http://localhost:3000/api/cron/refresh) || code=000

          if [ "$code" = "200" ]; then
            echo "### ✅ 스캔 완료" >> "$GITHUB_STEP_SUMMARY"
            printf '```json\n' >> "$GITHUB_STEP_SUMMARY"
            head -c 2000 "$body" >> "$GITHUB_STEP_SUMMARY"
            printf '\n```\n' >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "\`timedOut: true\` 이면 예산 안에서 다 못 돌았다는 뜻이고, 다음 실행이 이어서 처리합니다." >> "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "### ⚠️ 스캔 실패 (HTTP $code)"
              printf '```\n'
              head -c 1500 "$body" 2>/dev/null || echo "(응답 본문 없음)"
              printf '\n```\n'
              echo "앱 로그 마지막 30줄:"
              printf '```\n'
              tail -30 "$RUNNER_TEMP/app.log" 2>/dev/null || echo "(로그 없음)"
              printf '\n```\n'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stop app
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/app.pid" ]; then
            kill "$(cat "$RUNNER_TEMP/app.pid")" 2>/dev/null || true
          fi
          exit 0
